services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: 1000:1000
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      # Solo se confía en la cabecera de usuario si la petición viene del gateway
      ND_EXTAUTH_TRUSTEDSOURCES: 10.77.0.10/32
      # Copia automática de la base de datos: cada día a las 3:00 UTC, se guardan las últimas 7
      ND_BACKUP_PATH: /backup
      ND_BACKUP_SCHEDULE: "0 3 * * *"
      ND_BACKUP_COUNT: 7
    volumes:
      - ./data:/data
      - /mnt/biblioteca/musica:/music:ro
      - /mnt/biblioteca/respaldos/navidrome:/backup
    networks:
      - chirihome

  gateway:
    build: ../gateway
    container_name: gateway
    restart: unless-stopped
    env_file:
      - /home/chiri/gateway.env
    environment:
      UPSTREAM_URL: http://navidrome:4533
      DB_PATH: /data/gateway.db
    volumes:
      - /home/chiri/gateway-datos:/data
    ports:
      - "8000:8000"
    depends_on:
      - navidrome
    networks:
      chirihome:
        ipv4_address: 10.77.0.10

networks:
  chirihome:
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.0.0/24