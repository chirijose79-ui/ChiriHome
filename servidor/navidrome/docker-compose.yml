services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: 1000:1000
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      # Solo se confía en la cabecera de usuario si la petición viene del gateway.
      # ExtAuth es el nombre actual; el segundo es el antiguo, por si la versión es anterior.
      ND_EXTAUTH_TRUSTEDSOURCES: 10.77.0.10/32
      ND_REVERSEPROXYWHITELIST: 10.77.0.10/32
    volumes:
      - ./data:/data
      - /mnt/biblioteca/musica:/music:ro
    networks:
      - chirihome

  gateway:
    build: ../gateway
    container_name: gateway
    restart: unless-stopped
    env_file:
      - /home/chiri/gateway.env
    environment:
      UPSTREAM_URL: http://navidrome:4533
      DB_PATH: /data/gateway.db
    volumes:
      - /home/chiri/gateway-datos:/data
    ports:
      - "8000:8000"
    depends_on:
      - navidrome
    networks:
      chirihome:
        ipv4_address: 10.77.0.10

networks:
  chirihome:
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.0.0/24