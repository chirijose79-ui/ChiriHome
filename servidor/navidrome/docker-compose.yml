services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: 1000:1000
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
    volumes:
      - ./data:/data
      - /mnt/biblioteca/musica:/music:ro

  gateway:
    build: ../gateway
    container_name: gateway
    restart: unless-stopped
    env_file:
      - /home/chiri/gateway.env
    environment:
      UPSTREAM_URL: http://navidrome:4533
      DB_PATH: /data/gateway.db
    volumes:
      - /home/chiri/gateway-datos:/data
    ports:
      - "8000:8000"
    depends_on:
      - navidrome